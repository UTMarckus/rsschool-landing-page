<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="shortcut icon" href="./img/svg/logo.svg" type="image/x-icon">
  <title>Resource coffee house</title>
</head>

<body>

  <h1 class="main-title">Resource coffee house</h1>

  <header class="header">

        <ul class="nav-list flex-row">
          <li class="nav-item">
            <a href="#" class="nav-link">Favorite coffee</a>
          </li>
          <li class="nav-item">

          </li>
          <li class="nav-item">

          <li class="nav-item">

          </li>
        </ul>
      </nav>

</html>
